[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos2-signal"
version = "0.1.0"
description = "Free-data, long-only research scanner for a frozen US watchlist (design chronos2_hourly_v2, unvalidated)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies are the ones the offline research pipeline and the twelve
# integrity invariants need. Versions are pinned in requirements.txt to the
# versions the suite was actually run against; see docs/ENVIRONMENT.md.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "pandas-market-calendars>=4.3",
    "pyarrow>=14",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Market data provider. Unofficial access, so the version is part of the
# provenance record for every snapshot it produces.
provider = ["yfinance>=0.2.40"]
# Frozen forecasting checkpoint. Absent by default: the pipeline runs its
# invariant tests without it and refuses to fabricate forecasts when it is
# missing.
model = ["chronos-forecasting>=2.0", "torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
chronos2-signal = "chronos2_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::FutureWarning"]
